name: surgical-annotator
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch
  - torchvision
  - torchaudio
  - jpeg
  - pip
  - pip:
    - fastapi
    - "uvicorn[standard]"
    - python-multipart
    - aiofiles
    - Pillow
    - numpy
    - pycocotools
    - requests
    - opencv-python
    - huggingface_hub
    - tqdm
    - google-generativeai>=0.8.0
    - timm
    - pydantic-settings
    - sqlalchemy
    - aiosqlite
    - pytest
    - httpx
    - pytest-asyncio
